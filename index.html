<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Loop Board</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#16161a;--fg:#ececf0;--mut:#8b8b95;--bd:#2c2c34;--ac:#e5322d;--on:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#16161a;--fg:#ececf0;--mut:#8b8b95;--bd:#2c2c34}}
:root[data-theme="dark"]{--bg:#000;--card:#16161a;--fg:#ececf0;--mut:#8b8b95;--bd:#2c2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;flex:1}
#add{width:40px;height:40px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:26px;line-height:1;cursor:pointer}
#row{display:flex;flex-wrap:wrap;gap:16px;padding:18px;align-items:flex-start}
.card{flex:0 0 min(420px,86vw);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.title{width:100%;border:1px solid transparent;background:transparent;color:var(--fg);font:600 15px system-ui,sans-serif;padding:6px 8px;border-radius:6px;margin-bottom:8px}
.title:hover,.title:focus{border-color:var(--bd);outline:none}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ctl{display:flex;gap:8px;margin-top:10px}
.ctl button{flex:1;padding:9px 6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:14px;cursor:pointer}
.ctl button:hover{border-color:var(--mut)}
.ctl .loop.on{background:var(--on);border-color:var(--on);color:#fff}
.ctl .del{flex:0 0 40px;color:var(--mut)}
.top{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.top .title{margin-bottom:0;flex:1;min-width:0;width:auto}
.mv{border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;width:30px;height:30px;cursor:pointer;flex:0 0 30px}
.mv:hover{border-color:var(--mut)}
.grip{cursor:grab;color:var(--mut);padding:0 4px;user-select:none;font-size:18px}
.handle{flex:0 0 38px;height:38px;display:grid;place-items:center;font-size:24px;line-height:1;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--mut);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.handle:hover,.handle:active{background:var(--ac);border-color:var(--ac);color:#fff}
.card.drag{position:relative;z-index:50;box-shadow:0 12px 32px rgba(0,0,0,.7);opacity:.92}
#row.dragging{user-select:none;-webkit-user-select:none}
.card.over-l{box-shadow:-7px 0 0 var(--ac)}
.card.over-r{box-shadow:7px 0 0 var(--ac)}
#row.dragging iframe{pointer-events:none}
.vol{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--mut);font-size:13px}
.vol input{flex:1;accent-color:var(--ac);min-width:0}
.vol span{width:38px;text-align:right}
#empty{color:var(--mut);padding:40px 18px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);padding:18px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:15px}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
dialog button{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
dialog button.ok{background:var(--ac);border-color:var(--ac);color:#fff}
#err{color:var(--ac);font-size:13px;min-height:18px;margin-top:6px}
</style>
</head>
<body>
<header><h1>YouTube Loop Board</h1><button id="add" title="Afegeix un vídeo">+</button></header>
<div id="row"></div>
<div id="empty">Prem + i enganxa un enllaç de YouTube.</div>

<dialog id="dlg">
  <div style="font-weight:600;margin-bottom:10px">Enllaç del vídeo</div>
  <input id="url" placeholder="https://www.youtube.com/watch?v=... o https://youtu.be/..." autocomplete="off">
  <div id="err"></div>
  <div class="btns"><button id="cancel">Cancel·la</button><button class="ok" id="ok">Afegeix</button></div>
</dialog>

<script>
(function(){
  var KEY='ytloop:v1', videos=[], players={}, cards={}; // players[id] = {frame, loop, ready}
  var row=document.getElementById('row'), empty=document.getElementById('empty');
  var dlg=document.getElementById('dlg'), urlIn=document.getElementById('url'), err=document.getElementById('err');

  function save(){try{localStorage.setItem(KEY,JSON.stringify(videos));}catch(e){}}
  function load(){try{var s=localStorage.getItem(KEY);if(s)videos=JSON.parse(s)||[];}catch(e){videos=[];}}

  function parseId(u){
    u=(u||'').trim();
    var m=u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
    if(m)return m[1];
    return /^[\w-]{11}$/.test(u)?u:null;
  }
  function send(id,func,args){
    var p=players[id]; if(!p||!p.frame.contentWindow)return;
    p.frame.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:args||[]}),'*');
  }
  function listen(id){
    var p=players[id]; if(!p||!p.frame.contentWindow)return;
    p.frame.contentWindow.postMessage(JSON.stringify({event:'listening',id:id,channel:'widget'}),'*');
  }

  function render(){
    row.innerHTML=''; players={}; cards={};
    empty.style.display=videos.length?'none':'block';
    videos.forEach(function(v){
      var card=document.createElement('div'); card.className='card';
      if(typeof v.vol!=='number')v.vol=100;
      card.dataset.id=v.id; cards[v.id]=card; card.style.order=videos.indexOf(v);
      var t=document.createElement('input'); t.className='title'; t.value=v.title; t.title='Edita el títol';
      t.addEventListener('input',function(){v.title=t.value;save();});
      var box=document.createElement('div'); box.className='vid';
      var f=document.createElement('iframe');
      f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen=true;
      f.referrerPolicy='strict-origin-when-cross-origin';
      f.src='https://www.youtube.com/embed/'+v.vid+'?enablejsapi=1&rel=0&playsinline=1&origin='+encodeURIComponent(location.origin);
      box.appendChild(f);
      players[v.id]={frame:f,loop:!!v.loop};
      function applyVol(){send(v.id,'setVolume',[v.vol]);}
      f.addEventListener('load',function(){listen(v.id);setTimeout(function(){listen(v.id);applyVol();},600);setTimeout(applyVol,1500);});

      var ctl=document.createElement('div'); ctl.className='ctl';
      var play=btn('▶ / ⏸'), stop=btn('⏹ Inici'), loop=btn('🔁 Loop'), del=btn('✕');
      loop.classList.add('loop'); del.classList.add('del'); del.title='Elimina';
      if(v.loop)loop.classList.add('on');
      var playing=false; players[v.id].setPlaying=function(s){playing=s;};
      play.onclick=function(){send(v.id,playing?'pauseVideo':'playVideo');playing=!playing;};
      stop.onclick=function(){send(v.id,'seekTo',[0,true]);send(v.id,'pauseVideo');playing=false;};
      loop.onclick=function(){v.loop=!v.loop;players[v.id].loop=v.loop;loop.classList.toggle('on',v.loop);save();};
      del.onclick=function(){videos=videos.filter(function(x){return x.id!==v.id;});save();render();};
      ctl.append(play,stop,loop,del);
      var vol=document.createElement('div'); vol.className='vol';
      var vi=document.createElement('input'); vi.type='range'; vi.min=0; vi.max=100; vi.value=v.vol;
      var vl=document.createElement('span'); vl.textContent=v.vol+'%';
      vi.addEventListener('input',function(){v.vol=+vi.value;vl.textContent=v.vol+'%';applyVol();});
      vi.addEventListener('change',save);
      var ic=document.createElement('span'); ic.textContent='🔊'; ic.style.width='auto';
      vol.append(ic,vi,vl);
      var top=document.createElement('div'); top.className='top';
      var h=document.createElement('div'); h.className='handle'; h.textContent='\u283F'; h.title='Arrossega per moure';
      top.append(h,t);
      card.append(top,box,ctl,vol); row.appendChild(card);
    });
  }
  var dragId=null;
  function clearMarks(){Object.keys(cards).forEach(function(k){cards[k].classList.remove('over-l','over-r');});}
  function applyOrder(){videos.forEach(function(v,i){if(cards[v.id])cards[v.id].style.order=i;});}
  function moveTo(fromId,toId,after){
    var a=videos.findIndex(function(x){return x.id===fromId;});
    if(a<0)return;
    var it=videos.splice(a,1)[0];
    var b=videos.findIndex(function(x){return x.id===toId;});
    if(b<0){videos.splice(a,0,it);return;}
    videos.splice(after?b+1:b,0,it);
    applyOrder(); save();
  }
  var drag=null;
  row.addEventListener('pointerdown',function(e){
    var h=e.target.closest('.handle'); if(!h)return;
    var card=h.closest('.card'); e.preventDefault();
    drag={id:card.dataset.id,card:card,pid:e.pointerId,sx:e.clientX,sy:e.clientY,sScroll:window.scrollY,tgt:null,after:false};
    try{h.setPointerCapture(e.pointerId);}catch(x){}
    card.classList.add('drag'); row.classList.add('dragging');
  });
  row.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid)return;
    if(e.clientY<90)window.scrollBy(0,-14); else if(e.clientY>window.innerHeight-90)window.scrollBy(0,14);
    drag.card.style.transform='translate('+(e.clientX-drag.sx)+'px,'+(e.clientY-drag.sy+window.scrollY-drag.sScroll)+'px)';
    var tgt=null,after=false;
    for(var i=0;i<videos.length;i++){
      var id=videos[i].id; if(id===drag.id||!cards[id])continue;
      var r=cards[id].getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){tgt=id;after=e.clientX>r.left+r.width/2;break;}
    }
    clearMarks(); drag.tgt=tgt; drag.after=after;
    if(tgt)cards[tgt].classList.add(after?'over-r':'over-l');
  });
  function endDrag(e){
    if(!drag||e.pointerId!==drag.pid)return;
    var d=drag; drag=null;
    d.card.classList.remove('drag'); d.card.style.transform=''; row.classList.remove('dragging'); clearMarks();
    if(e.type==='pointerup'&&d.tgt)moveTo(d.id,d.tgt,d.after);
  }
  row.addEventListener('pointerup',endDrag);
  row.addEventListener('pointercancel',endDrag);
  function move(id,dir){
    var a=videos.findIndex(function(x){return x.id===id;}), b=a+dir;
    if(a<0||b<0||b>=videos.length)return;
    var it=videos.splice(a,1)[0]; videos.splice(b,0,it);
    applyOrder(); save();
    cards[id].scrollIntoView({behavior:'smooth',inline:'nearest',block:'nearest'});
  }
  function btn(txt){var b=document.createElement('button');b.textContent=txt;return b;}

  // Events coming from the YouTube iframes
  window.addEventListener('message',function(e){
    if(e.origin.indexOf('youtube.com')<0)return;
    var d; try{d=typeof e.data==='string'?JSON.parse(e.data):e.data;}catch(x){return;}
    if(!d||!d.event)return;
    var id=Object.keys(players).filter(function(k){return players[k].frame.contentWindow===e.source;})[0];
    if(!id)return;
    var p=players[id], st=null;
    if(d.event==='onStateChange')st=d.info;
    else if(d.event==='infoDelivery'&&d.info&&typeof d.info.playerState==='number')st=d.info.playerState;
    if(st===null)return;
    if(st===1)p.setPlaying(true);
    else if(st===2||st===5||st===-1)p.setPlaying(false);
    else if(st===0){
      if(p.loop){send(id,'seekTo',[0,true]);send(id,'playVideo');p.setPlaying(true);}
      else p.setPlaying(false);
    }
  });

  function openDlg(){urlIn.value='';err.textContent='';dlg.showModal();urlIn.focus();}
  function addVideo(){
    var vid=parseId(urlIn.value);
    if(!vid){err.textContent='No reconec aquest enllaç de YouTube.';return;}
    videos.push({id:'v'+Date.now(),vid:vid,title:'Vídeo '+(videos.length+1),loop:true});
    save();dlg.close();render();
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  }
  document.getElementById('add').onclick=openDlg;
  document.getElementById('cancel').onclick=function(){dlg.close();};
  document.getElementById('ok').onclick=addVideo;
  urlIn.addEventListener('keydown',function(e){if(e.key==='Enter')addVideo();});

  load();render();
})();
</script>
</body>
</html>
